<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú - Ala-taque</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="header-container">
    <div class="header-text">
      <h1 id="restaurant-name">Cargando...</h1>
      <p id="restaurant-tagline"></p>
    </div>
    <img id="restaurant-logo" src="" alt="Logo" class="logo-img" style="display: none;">
  </header>

  <main id="menu-container"></main>

  <footer>
    <p>¡Buen provecho!</p>
  </footer>

  <script>
    function renderPicor(nivel) {
      if (!nivel || nivel === 0) return '';
      return `<span class="picor-badge">${'🌶️'.repeat(nivel)}</span>`;
    }

    fetch('menu.json?v=' + new Date().getTime())
      .then(response => response.json())
      .then(data => {
        document.getElementById('restaurant-name').textContent = data.negocio;
        document.getElementById('restaurant-tagline').textContent = data.eslogan;

        const logoUrl = data.logo || 'logo.png';
        const logoImg = document.getElementById('restaurant-logo');
        logoImg.src = logoUrl;
        logoImg.onload = () => { logoImg.style.display = 'block'; };

        const container = document.getElementById('menu-container');

        data.categorias.forEach((cat, index) => {
          const section = document.createElement('section');
          section.className = 'category';

          const catPriceHTML = cat.precio ? `<span class="cat-price">$${cat.precio}</span>` : '';

          // Encabezado interactivo con indicador de flecha
          const catHeaderHTML = `
            <div class="category-header">
              <h2>${cat.nombre}</h2>
              <div class="header-right">
                ${catPriceHTML}
                <span class="accordion-icon">▼</span>
              </div>
            </div>
          `;

          let itemsHTML = cat.items.map(item => {
            let opcionesHTML = '';
            if (item.opciones && item.opciones.length > 0) {
              const listaOpciones = item.opciones.map(op => `<li>${op}</li>`).join('');
              opcionesHTML = `
                <div class="item-opciones">
                  <small><strong>${item.opciones_titulo || 'Opciones:'}</strong></small>
                  <ul>${listaOpciones}</ul>
                </div>
              `;
            }

            const itemPrice = item.precio !== undefined ? item.precio : cat.precio;
            const showItemPrice = !cat.precio && itemPrice !== undefined;
            const priceHTML = showItemPrice ? `<div class="item-price">$${itemPrice}</div>` : '';

            return `
              <div class="item ${item.disponible ? '' : 'agotado'}">
                <div class="item-info">
                  <h3>
                    ${item.nombre} 
                    ${renderPicor(item.picor)}
                    ${item.disponible ? '' : '<span class="badge-agotado">(Agotado)</span>'}
                  </h3>
                  <p>${item.descripcion}</p>
                  ${opcionesHTML}
                </div>
                ${priceHTML}
              </div>
            `;
          }).join('');

          // Contenedor colapsable para los platillos
          const contentDiv = document.createElement('div');
          contentDiv.className = 'category-content';
          contentDiv.innerHTML = itemsHTML;

          section.innerHTML = catHeaderHTML;
          section.appendChild(contentDiv);

          // Abrir por defecto únicamente la primera categoría (Alitas)
          if (index === 0) {
            section.classList.add('active');
          }

          // Evento al hacer clic en el encabezado de la categoría
          section.querySelector('.category-header').addEventListener('click', () => {
            const isAlreadyActive = section.classList.contains('active');

            // Cierra todas las demás categorías
            document.querySelectorAll('.category').forEach(c => c.classList.remove('active'));

            // Si la categoría clickeada no estaba abierta, la abre
            if (!isAlreadyActive) {
              section.classList.add('active');
            }
          });

          container.appendChild(section);
        });
      })
      .catch(error => console.error('Error cargando el menú:', error));
  </script>
</body>

</html>
