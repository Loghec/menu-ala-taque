<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú - Ala-taque</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="header-container">
    <img id="restaurant-logo" src="" alt="Logo" class="logo-img" style="display: none;">
    <div id="restaurant-logo-fallback" class="logo-fallback" style="display: none;"></div>
    <div class="header-text">
      <h1 id="restaurant-name">Cargando...</h1>
      <p id="restaurant-tagline"></p>
    </div>
  </header>

  <nav id="category-tabs" class="category-tabs"></nav>

  <main id="menu-container"></main>

  <!-- Modal para personalizar productos (Alitas, Papas, etc.) -->
  <div id="options-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 id="modal-title">Personaliza tu Orden</h3>

      <!-- Este contenedor cargará dinámicamente cualquier opción -->
      <div id="modal-options-body"></div>

      <button id="confirm-options-btn" class="btn-confirm" onclick="confirmarSeleccionGenerica()">Agregar al
        Pedido</button>
    </div>
  </div>

  <!-- Modal "Ver mi pedido": resumen antes de pagar -->
  <div id="review-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeReviewModal()">&times;</span>
      <h3>Mi Pedido</h3>

      <div id="review-items-body"></div>

      <div class="review-total-row">
        <span>Total</span>
        <span id="review-total-amount">$0</span>
      </div>

      <button id="review-continue-btn" class="btn-confirm" onclick="continuarAPago()">Continuar con el pago</button>
      <button class="btn-secondary" onclick="closeReviewModal()">Seguir viendo el menú</button>
    </div>
  </div>

  <!-- Modal de Confirmación y Pago -->
  <div id="checkout-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeCheckoutModal()">&times;</span>
      <h3>Detalles del Pago</h3>

      <div class="option-group">
        <h4>¿Cómo vas a pagar?</h4>
        <label class="radio-label">
          <input type="radio" name="metodo_pago" value="Efectivo" checked onchange="togglePagoEfectivo(true)"> Efectivo
          💵
        </label>
        <label class="radio-label">
          <input type="radio" name="metodo_pago" value="Transferencia" onchange="togglePagoEfectivo(false)">
          Transferencia 🏦
        </label>
      </div>

      <div id="pago-efectivo-container" class="option-group">
        <h4>¿Con cuánto vas a pagar?</h4>
        <input type="number" id="monto-pago" placeholder="Ej. 200, 500" class="input-pago" oninput="calcularCambio()">
        <div id="cambio-info" class="cambio-text"></div>
      </div>

      <div id="pago-transferencia-container" class="option-group" style="display:none;">
        <h4>Datos para tu transferencia</h4>
        <div id="datos-transferencia-body"></div>
        <div class="cambio-text" style="color: var(--accent-gold);">Favor de enviar comprobante de pago 🧾</div>
      </div>

      <button class="btn-confirm" onclick="enviarPedidoWhatsAppFinal()">Enviar por WhatsApp 💬</button>
    </div>
  </div>

  <!-- Barra flotante inferior para revisar y realizar el pedido -->
  <div id="cart-bar" class="cart-bar hidden">
    <div class="cart-info">
      <span id="cart-count">0 ítems</span>
      <strong id="cart-total">$0</strong>
    </div>
    <button class="btn-whatsapp" onclick="openReviewModal()">Ver mi pedido</button>
  </div>

  <script>
    window.MENU_JSON_PATH = 'menu.json';
  </script>
  <script src="main.js"></script>
</body>

</html>
